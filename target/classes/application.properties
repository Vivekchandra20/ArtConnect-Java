spring.application.name=artwork-platform

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static resources served from /static/**
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/static/
spring.mvc.static-path-pattern=/static/**

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ArtConnect?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vivek@123
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Initialize schema automatically
spring.sql.init.mode=always
